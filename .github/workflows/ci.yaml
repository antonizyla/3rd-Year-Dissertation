name: Lint, Format, Auto-fix 
on: [push]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v3
      with:
        python-version: "3.13"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        sudo apt-get install sqlite3 libsqlite3-dev
    - name: Format with ruff 
      run: |
        ruff format ./src/
    - name: Auto fix ruff 
      run: |
        ruff check ./src/ --fix
        ruff check ./test/ --fix
        ruff format ./src/
        ruff format ./test/
        git config user.name github-actions
        git config user.email github-actions@github.com 
        git add ./src/
        git add ./test/
        git commit -m "Formatted and Linted using Ruff" || echo "No commit required"
        git push
    - name: Auto Generate Documentation using pdoc
      run: |
        cd src/
        pdoc ./*.py -o ../docs
        cd ..
        git add .
        git config user.name github-actions
        git config user.email github-actions@github.com
        git commit -m "Generated Documentation" || echo "No commit required"
        git push
    - name: Test with Pytest
      run: |
        pytest

