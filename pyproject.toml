[project]
name = "Influence_Modelling"
version = "0.0.1"
authors = [{ name = "Antoni Zyla", email = "antoni.zyla@warwick.ac.uk" }]
description = "Influence Modelling test suite project."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/antonizyla"
Issues = "https://github.com/antonizyla"

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"
